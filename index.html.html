            100% { opacity: 1; transform: translateY(0) scale(1); }

                { id: 'meal', icon: 'utensils', label: '급식 찰칵' },
                { id: 'education', icon: 'book-open', label: '알록달록 교육' },
                { id: 'market', icon: 'shopping-bag', label: '토큰 상점' },
                { id: 'ranking', icon: 'bar-chart-2', label: '명예의 전당' },
                { id: 'lost', icon: 'book-heart', label: '분실물 도감' }
            ];

            return (
                <div className="flex h-screen bg-[#FFF5F8] font-sans text-gray-800 overflow-hidden w-full relative selection:bg-pink-200">
                    {/* 데스크탑 사이드바 (플로팅 & 라운드 스타일) */}
                    <aside className="w-72 bg-white/80 backdrop-blur-xl border border-white flex-col z-20 hidden md:flex m-4 rounded-[2.5rem] shadow-[0_10px_40px_rgba(244,114,182,0.1)]">
                        <div className="p-8 pt-10 text-center">
                            <div className="w-16 h-16 bg-gradient-to-br from-pink-300 to-purple-300 rounded-[1.5rem] flex items-center justify-center mx-auto mb-4 shadow-lg shadow-pink-200">
                                <i data-lucide="school" className="w-8 h-8 text-white"></i>
                            </div>
                            <h1 className="font-bubbly text-2xl text-gray-800 leading-tight mb-6">우리가 발전 시키는 학교</h1>
                            <div className="bg-pink-50 text-pink-600 px-4 py-3 rounded-[1.5rem] font-bold flex items-center justify-center gap-2 border border-pink-100">
                                <span className="text-sm">내 지갑</span>
                                <span className="text-xl flex items-center">🪙 {tokens.toLocaleString()}</span>
                            </div>
                        </div>
                        <nav className="flex-1 overflow-y-auto custom-scrollbar p-6 flex flex-col gap-3">
                            {navItems.map(item => (
                                <button 
                                    key={item.id} 
                                    onClick={() => setView(item.id)}
                                    className={`flex items-center gap-4 w-full p-4 rounded-[1.5rem] transition-all duration-300 font-bold ${
                                        view === item.id 
                                        ? 'bg-gradient-to-r from-pink-100 to-rose-50 text-pink-600 shadow-sm border border-pink-100 transform scale-105' 
                                        : 'text-gray-500 hover:bg-gray-50 hover:text-gray-700'
                                    }`}>
                                    <i data-lucide={item.icon} className={`w-5 h-5 ${view === item.id ? 'stroke-[3]' : 'stroke-2'}`}></i>
                                    <span>{item.label}</span>
                                </button>
                            ))}
                        </nav>
                    </aside>

                    {/* 메인 컨텐츠 영역 */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        {/* 모바일 헤더 (소프트 스타일) */}
                        <header className="md:hidden sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-pink-50 p-4 flex justify-between items-center rounded-b-[2rem] shadow-sm m-2 mt-0">
                            <h1 className="font-bubbly text-xl text-gray-800 tracking-tight truncate flex items-center gap-2">
                                <i data-lucide="school" className="text-pink-400 w-5 h-5"></i> 우리학교
                            </h1>
                            <div className="bg-pink-50 text-pink-600 px-4 py-2 rounded-full font-bold flex items-center gap-1 border border-pink-100 text-sm">
                                <span>🪙</span> {tokens}
                            </div>
                        </header>

                        {/* 뷰 컨텐츠 */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-10 pb-28 md:pb-10">
                            <div className="max-w-6xl mx-auto w-full">
                                {view === 'home' && <HomeView />}
                                {view === 'report' && <ReportView addTokens={addTokens} showModal={showModal} />}
                                {view === 'meal' && <MealCheckView addTokens={addTokens} showModal={showModal} />}
                                {view === 'education' && <EducationView addTokens={addTokens} showModal={showModal} />}
                                {view === 'market' && <MarketView tokens={tokens} setTokens={setTokens} showModal={showModal} />}
                                {view === 'ranking' && <RankingView />}
                                {view === 'lost' && <LostFoundView foundItems={foundItems} setFoundItems={setFoundItems} addTokens={addTokens} showModal={showModal} />}
                            </div>
                        </div>

                        {/* 모바일 하단 플로팅 네비게이션 */}
                        <nav className="md:hidden fixed bottom-4 left-4 right-4 bg-white/90 backdrop-blur-xl border border-white flex justify-around items-center px-2 py-3 shadow-[0_10px_30px_rgba(244,114,182,0.15)] z-40 rounded-[2rem]">
                            {navItems.map(item => (
                                <button 
                                    key={item.id} 
                                    onClick={() => setView(item.id)}
                                    className={`flex flex-col items-center justify-center w-full py-2 rounded-2xl transition-all duration-300 ${
                                        view === item.id ? 'text-pink-500 bg-pink-50 transform -translate-y-1' : 'text-gray-400 hover:text-gray-600'
                                    }`}>
                                    <i data-lucide={item.icon} className={`w-6 h-6 mb-1 ${view === item.id ? 'stroke-[2.5]' : 'stroke-2'}`}></i>
                                    <span className="text-[10px] font-bold">{item.label}</span>
                                </button>
                            ))}
                        </nav>
                    </main>

                    <Modal 
                        isOpen={modal.isOpen} 
                        title={modal.title} 
                        content={modal.content} 
                        onClose={closeModal} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
